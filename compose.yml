services:
  db:
    image: postgres:17
    env_file:
      - "./server/.env"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  server:
    depends_on:
      - db
    build:
      context: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app

volumes:
  db_data: