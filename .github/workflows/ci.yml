name: Backend CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: Marachewka1
          POSTGRES_DB: stockPreviews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d stockPreviews_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      
      - name: Install dependecies
        run: npm ci
        working-directory: server

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: 'postgresql://admin:Marachewka1@localhost:5432/stockPreviews_test?schema=public'

      - name: Run tests
        run: npm test -- --runInBand
        working-directory: server
        env:
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: 'postgresql://admin:Marachewka1@localhost:5432/stockPreviews_test?schema=public'

      - name: Lint
        run: npm run lint
        working-directory: server
